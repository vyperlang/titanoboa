name: unitary

on:
  pull_request:
  push:  # all

jobs:
  unitary:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.10", "3.11", "3.12" ]

    name: "unit tests: python ${{ matrix.python-version }}"
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Requirements
        run: |
          pip install -r dev-requirements.txt
          pip install .

      - name: Run Unit Tests
        id: unit_tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        # Start coverage before pytest imports boa's plugin. pytest-cov then
        # measures the xdist workers; combine both collectors before reporting.
        run: |
          coverage erase
          coverage run --parallel-mode -m pytest \
            --cov=boa --cov-append --cov-report= -nauto tests/unitary/

      - name: Report Coverage
        if: ${{ !cancelled() && steps.unit_tests.outcome != 'skipped' }}
        run: |
          coverage combine --append
          coverage report --show-missing --skip-covered --fail-under=78

  anvil:
    name: "integration tests (anvil)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Requirements
        run: |
          pip install -r dev-requirements.txt
          pip install .

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Run Networked Tests against anvil
        # run separately to clarify its dependency on outside binary
        run: pytest -n auto tests/integration/network/anvil/
